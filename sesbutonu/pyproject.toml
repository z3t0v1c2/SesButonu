[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sesbutonu"
version = "0.1.0"
description = "Ses dosyalarına tuş atayıp tuşa basınca çalan Linux aracı (GUI)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["evdev", "PySide6"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
sesbutonu = "sesbutonu:main"

[tool.setuptools]
py-modules = ["sesbutonu"]
